services:
  wordpress:
    build:
      dockerfile: ./wordpress/docker/Dockerfile
    command: apache2-foreground
    container_name: wordpress
    restart: always
    env_file: .env
    environment:
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME}
    volumes:
      - ./wordpress/src/wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wordpress/src/wp-content/uploads:/var/www/html/wp-content/uploads
      - ./wordpress/src/wp-content/themes:/var/www/html/wp-content/themes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=myresolver"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # Middlewares
      - "traefik.http.routers.${APP_NAME}.middlewares=block-scan@docker,compres\
        s@docker"
      - "traefik.http.routers.target.middlewares=anubis@docker" # Use the Anubis middleware
      # Gzip compression
      - "traefik.http.middlewares.compress.compress=true"
      # Timeouts
      - "traefik.http.serversTransports.${APP_NAME}-transport.forwardingTimeout\
        s.dialTimeout=60s"
      - "traefik.http.serversTransports.${APP_NAME}-transport.forwardingTimeout\
        s.responseHeaderTimeout=300s"
      - "traefik.http.serversTransports.${APP_NAME}-transport.forwardingTimeout\
        s.idleConnTimeout=300s"
    networks:
      - web
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: mariadb:latest
    container_name: db
    restart: always
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/my.cnf
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-read-only-compressed=OFF"
    env_file: .env
    environment:
      - MYSQL_USER=${WORDPRESS_DB_USER}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME}
      - MYSQL_ALLOW_EMPTY_PASSWORD=0
      - TZ=Europe/Paris
    networks:
      - web
    labels:
      - "traefik.enable=false"

  traefik:
    image: traefik:v3.6
    container_name: traefik
    depends_on:
      - anubis
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Resolver
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    labels:
      # Security headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains\
        =true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=t\
        rue"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      # Cache static assets
      - "traefik.http.middlewares.cache-headers.headers.customresponseheaders.C\
        ache-Control=public, max-age=31536000"
      # Anubis middleware
      - "traefik.http.middlewares.anubis.forwardauth.address=http://anubis:8080\
        /.within.website/x/cmd/anubis/api/check"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik/acme.json:/letsencrypt/acme.json"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  anubis:
    image: ghcr.io/techarohq/anubis:main
    environment:
      - BIND=:8080 # where to listen for Traefik
      - "TARGET= " # do redirect - ensure there is a space after '='
      # Specifies which domains Anubis is allowed to redirect to.
      - REDIRECT_DOMAINS=${DOMAIN_NAME}
      # Should be the full external URL for Anubis (including scheme)
      - PUBLIC_URL=https://${ANUBIS_DOMAIN_NAME}
      # Should match your domain for proper cookie scoping
      - COOKIE_DOMAIN=${DOMAIN_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anubis.rule=Host(`${ANUBIS_DOMAIN_NAME}`)" # Only Matching Requests for this domain
      - "traefik.http.routers.anubis.entrypoints=websecure"
      - "traefik.http.services.anubis.loadbalancer.server.port=8080" # telling Traefik where to receive requests
      - "traefik.http.routers.anubis.service=anubis" # telling Traefik to use the above specified port
      - "traefik.http.routers.anubis.tls.certresolver=myresolver" # telling Traefik to resolve a cert for Anubis
    networks:
      - web

volumes:
  db_data:

networks:
  web:
    driver: bridge
