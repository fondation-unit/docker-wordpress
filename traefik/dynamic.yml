http:
  middlewares:
    # anubis:
    #   forwardAuth:
    #     address: "http://anubis:8080/.within.website/x/cmd/anubis/api/check"

    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true

    compress:
      compress: {}

    block-scan:
      redirectRegex:
        regex: "^/(\\.git|\\.env|\\.DS_Store|v2/_catalog|server-status|setup|console).*"
        replacement: "/"
        permanent: false
